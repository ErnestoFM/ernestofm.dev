name: Dependency Audit

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: npm audit + depcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: |
          npm audit --audit-level=critical 2>&1 | tee audit-report.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run depcheck
        id: depcheck
        run: |
          npx depcheck 2>&1 | tee depcheck-report.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Create GitHub Issue if vulnerabilities found
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const auditReport = fs.readFileSync('audit-report.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔒 Security: Critical npm vulnerabilities found - ${new Date().toISOString().split('T')[0]}`,
              body: `## Automated Dependency Audit\n\nCritical vulnerabilities detected in npm packages.\n\n\`\`\`\n${auditReport.slice(0, 3000)}\n\`\`\`\n\nPlease review and update affected packages.`,
              labels: ['security', 'dependencies'],
            });
